<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: lightblue;
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
}

.box {
    background-color: white;
    width: 405px;
    max-width: 90%;
    padding: 35px 32px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 8px 20px gray;
    animation: grade 0.8s ease;
}

h2 {
    color: purple;
    font-size: 28px;
    margin-top: 12px;
    margin-bottom: 25px;
}

p {
    color: black;
    font-size: 16px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 2px solid grey;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: 0.3s ease;
}

input:focus {
    border-color: purple;
    box-shadow: 0 0 6px grey;
}

button {
    background-color: purple;
    color: white;
    padding: 13px 24px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    background-color: grey;
    transform: scale(1.05);
    box-shadow: 0 4px 10px lightgrey;
}

#result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: purple;
}

@keyframes grade {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    .box {
        width: 90%;
        padding: 25px 20px;
    }

    h2 {
        font-size: 23px;
    }

    p {
        font-size: 14px;
    }
}
</style>
</head>
<body>

<div class="box">

    <h2>GRADE CALCULATOR</h2>
    <p>Enter your marks and check your result!</p>

    <input type="number" id="mark1" placeholder="Enter Mark 1"><br>
    <input type="number" id="mark2" placeholder="Enter Mark 2"><br>
    <input type="number" id="mark3" placeholder="Enter Mark 3"><br>
    <input type="number" id="mark4" placeholder="Enter Mark 4"><br>
    <input type="number" id="mark5" placeholder="Enter Mark 5"><br>

    <button onclick="grade()">CHECK RESULT</button>

</div>

<script>
function grade() {
    let m1 = Number(document.getElementById("mark1").value);
    let m2 = Number(document.getElementById("mark2").value);
    let m3 = Number(document.getElementById("mark3").value);
    let m4 = Number(document.getElementById("mark4").value);
    let m5 = Number(document.getElementById("mark5").value);

    let total = m1 + m2 + m3 + m4 + m5;
    let average = total / 5;

    let status = "";

    if (average >= 50) {
        status = "Passed";
    } else {
        status = "Failed";
    }

    alert("Total: " + total +
          "\nAverage: " + average + "%" +
          "\nStatus: " + status);
}
</script>
</body>
</html>
